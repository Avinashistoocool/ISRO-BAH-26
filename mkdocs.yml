site_name: ISRO-BAH-26
site_description: Subsurface ice mapping and rover traverse planning at the lunar south pole with Chandrayaan-2 DFSAR
site_url: https://avinashistoocool.github.io/ISRO-BAH-26/
repo_url: https://github.com/Avinashistoocool/ISRO-BAH-26
repo_name: Avinashistoocool/ISRO-BAH-26
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  *.tex

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: indigo
      accent: light blue
      toggle: {icon: material/brightness-7, name: Dark mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Technical report (PDF): ISRO-BAH-26_Technical_Report.pdf
  - Pitch deck (PDF): Final_ISRO_pitch.pdf

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.highlight
