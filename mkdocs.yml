site_name: ISRO-BAH-26
site_description: "ISRO-BAH-26 by Avinash Chandra Gupta and Team Nakshatra: lunar south pole ice mapping with Chandrayaan-2 DFSAR and rover path planning."
site_url: https://avinashistoocool.github.io/ISRO-BAH-26/
site_author: Avinash Chandra Gupta
copyright: \"&copy; 2026 Avinash Chandra Gupta (Avinash Gupta) &middot; <a href='https://avinashistoocool.github.io/'>avinashistoocool.github.io</a>\"
repo_url: https://github.com/Avinashistoocool/ISRO-BAH-26
repo_name: Avinashistoocool/ISRO-BAH-26
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  *.tex

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: indigo
      accent: light blue
      toggle: {icon: material/brightness-7, name: Dark mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Technical report (PDF): ISRO-BAH-26_Technical_Report.pdf
  - Pitch deck (PDF): Final_ISRO_pitch.pdf

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.highlight

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://avinashistoocool.github.io/
      name: Avinash Chandra Gupta
    - icon: fontawesome/brands/github
      link: https://github.com/Avinashistoocool
      name: Avinash Chandra Gupta on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/avinashistoocool
      name: Avinash Chandra Gupta on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/suprcoolavinash
      name: Avinash Chandra Gupta on X
